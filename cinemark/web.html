/* APP 内（WebView + AndroidCM 桥存在）返回键/边缘手势已由 __cmHasOpen/__cmBack 桥接管，
   各级「关闭」函数不再调用 history.back()——file:// 单历史栈上 back() 会跳到 about:blank，
   把页面状态打乱。纯浏览器环境保留 history.back() 让前进键可用。 */
function inApp() { return !!(window.AndroidCM && typeof AndroidCM.appVersionName === 'function'); }

/* 每次开/关层（全屏/播放器/弹窗/关于）后主动上报原生，
   让 Android 侧同步读 cmLayerOpen 而非每次异步 evaluateJavascript。 */
function _cmSyncLayer() {
  try {
    if (window.AndroidCM && typeof AndroidCM.reportLayer === 'function') {
      AndroidCM.reportLayer(!!__cmHasOpen());
    }
  } catch (e) {}
}
/* 双保险：监听所有可能存在的层元素 class 变化，任何路径开/关层都自动补报原生，
   杜绝个别入口漏调 _cmSyncLayer 导致返回手势误判「无层可关 → 直接双击退出」。
   注意：qrLightbox / shareCardLb 是动态创建的，必须在 document.body 上监听子树变化，
   而不是仅 observe 静态元素（那些在 observer 初始化时可能还不存在）。 */
(function() {
  if (!window.MutationObserver) return;
  var staticIds = ['player', 'modal', 'aboutModal'];
  staticIds.forEach(function(id) {
    var el = document.getElementById(id);
    if (!el) return;
    new MutationObserver(function() { _cmSyncLayer(); }).observe(el, { attributes: true, attributeFilter: ['class'] });
  });
  // 动态层：monitor body subtree 变化（qrLightbox/shareCardLb 在点击时才创建）
  var bodyEl = document.body;
  if (bodyEl) {
    new MutationObserver(function(mutations) {
      for (var i = 0; i < mutations.length; i++) {
        var m = mutations[i];
        if (m.type === 'attributes' && m.attributeName === 'class') {
          _cmSyncLayer();
          return;
        }
      }
    }).observe(bodyEl, { attributes: true, attributeFilter: ['class'], subtree: true });
  }
})();

/* ===== 原生返回键/边缘手势桥：MainActivity 用此判断「是否有可关闭的层」 =====
   file:// 下 history.pushState 未必进入 WebView 的 back 列表（opaque origin 可能抛 SecurityError 被静默吞掉），
   导致 webView.canGoBack() 恒为 false → 一次返回手势直接 finish() 退出 APP。
   改为由网页层直接报告/关闭当前层，完全不依赖历史栈：
   返回键/边缘右滑 → 先关播放器(或非全屏)回上一级 → 再关全屏 → 再关弹窗，最后才到「双击退出」。 */
window.__cmHasOpen = function() {
  var pl = document.getElementById('player');
  var md = document.getElementById('modal');
  var ab = document.getElementById('aboutModal');
  if (pl && pl.classList.contains('open')) return true;
  if (md && md.classList.contains('open')) return true;
  if (ab && ab.classList.contains('open')) return true;
  var qr = document.getElementById('qrLightbox');
  if (qr && qr.classList.contains('open')) return true;
  var sc = document.getElementById('shareCardLb');
  if (sc && sc.classList.contains('open')) return true;
  return false;
};
window.__cmBack = function() {
  var pl = document.getElementById('player');
  // 全屏中：先退回网页全屏（仍停留在播放页），下一次返回才关播放器 —— 满足「先回上一级」
  if (pl && pl.classList.contains('full')) { cmExitFull(); return; }
  if (pl && pl.classList.contains('open')) { closePlayer(); return; }
  var md = document.getElementById('modal');
  if (md && md.classList.contains('open')) { closeModal(); return; }
  var ab = document.getElementById('aboutModal');
  if (ab && ab.classList.contains('open')) { closeAbout(); return; }
  var sc = document.getElementById('shareCardLb');
  if (sc && sc.classList.contains('open')) { closeShareCardLb(); return; }
  var qr = document.getElementById('qrLightbox');
  if (qr && qr.classList.contains('open')) { closeQrLightbox(); return; }
};

/* ===== 全屏手势：左半上下滑=音量 / 右半上下滑=亮度 / 左右滑=快进退 ===== */
(function() {
  var area = document.getElementById('playerArea');
  if (!area) return;
  var tipTimer = null;
  function showTip(txt) {
    tip.textContent = txt; tip.style.opacity = '1';
    if (tipTimer) clearTimeout(tipTimer);
    tipTimer = setTimeout(function() { tip.style.opacity = '0'; }, 900);
  }
  var sx = 0, sy = 0, mode = "", moved = false, armed = false, baseVol = 0, baseDim = 0, seekFrom = 0, seekTo = -1;
  function inFull() {
    var pl = document.getElementById('player');
    // 放宽：播放器打开即启用手势（非全屏也可滑音量/亮度/进度），不再要求 .full；
    // 无 <video> 的源（iframe 源/加载超时）也可滑音量（走原生媒体音量）与亮度，仅快进快退需要 video
    return pl && pl.classList.contains('open');
  }
  // doPlay/useIframe 每次都会 area.innerHTML='' 重建内容，把叠层冲掉——
  // 改为惰性取用：叠层不在 playerArea 里就重新挂回去，亮度遮罩/提示永远可用
  function getDim() {
    var el = document.getElementById('swipeDim');
    if (!el) { el = document.createElement('div'); el.id = 'swipeDim'; }
    if (el.parentNode !== area) area.appendChild(el);
    return el;
  }
  function getTip() {
    var el = document.getElementById('swipeTip');
    if (!el) { el = document.createElement('div'); el.id = 'swipeTip'; }
    if (el.parentNode !== area) area.appendChild(el);
    return el;
  }
  function showTip(txt) {
    var tip = getTip();
    tip.textContent = txt; tip.style.opacity = '1';
    if (tipTimer) clearTimeout(tipTimer);
    tipTimer = setTimeout(function() { tip.style.opacity = '0'; }, 900);
  }
  area.addEventListener('touchstart', function(e) {
    if (!inFull()) { armed = false; return; }
    var t = e.touches[0];
    // 屏幕左右边缘 32px 内的触摸让给系统返回手势：三区手势在这块 preventDefault
    // 会吞掉 MIUI/HyperOS 的边缘内滑返回，表现为「播放页/选集列表手势返回失效」
    var W = window.innerWidth || area.clientWidth || 0;
    if (W && (t.clientX < 32 || t.clientX > W - 32)) { armed = false; moved = false; mode = ""; return; }
    armed = true;
    sx = t.clientX; sy = t.clientY; moved = false; mode = ""; seekTo = -1;
    var v = curPlayerVideo();
    baseVol = v ? v.volume : (window.AndroidCM && typeof AndroidCM.getVolPct === 'function' ? AndroidCM.getVolPct() / 100 : 0.5);
    baseDim = parseFloat(getDim().style.opacity || "0"); seekFrom = v ? (v.currentTime || 0) : 0;
  }, { passive: true });
  area.addEventListener('touchmove', function(e) {
    if (!inFull() || !armed) return;
    var v = curPlayerVideo();
    var t = e.touches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    if (!moved) {
if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
      moved = true;
mode = Math.abs(dx) > Math.abs(dy) ? "seek" : (sx < (area.clientWidth / 2) ? "vol" : "bri");
    }
    var w = area.clientWidth || 1, hh = area.clientHeight || 1;
    if (mode === "vol") {
      e.preventDefault();
      var nv = Math.min(1, Math.max(0, baseVol - dy / hh));
      if (v) { v.volume = nv; v.muted = (nv === 0); }
      else if (window.AndroidCM && typeof AndroidCM.setVolPct === 'function') AndroidCM.setVolPct(Math.round(nv * 100));
      showTip('音量 ' + Math.round(nv * 100) + '%');
    } else if (mode === "bri") {
      e.preventDefault();
      var no = Math.min(0.75, Math.max(0, baseDim + dy / hh));
      getDim().style.opacity = no;
      showTip('亮度 ' + Math.round((1 - no / 0.75) * 100) + '%');
    } else if (mode === "seek") {
      if (!v) { showTip('当前播放源不支持快进快退'); return; }
      e.preventDefault();
      var dsec = Math.round(dx / w * 120);
      var dur = v.duration || 0;
      var tgt = Math.min(dur > 2 ? dur - 1 : dur, Math.max(0, seekFrom + dsec));
      seekTo = tgt;
      showTip((dsec >= 0 ? '快进 ' : '快退 ') + Math.abs(dsec) + ' 秒');
    }
  }, { passive: false });
  area.addEventListener('touchend', function() {
    if (armed && moved && mode === "seek" && seekTo >= 0) {
      var v = curPlayerVideo();
      if (v) { try { v.currentTime = seekTo; } catch (e) {} }
    }
    armed = false; moved = false; mode = ""; seekTo = -1;
  });
})();
