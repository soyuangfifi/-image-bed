/* ===== 移动端竖屏：视频区固定 16/9 高度、下方列表平摊整宽 ===== */

.ab-logo-wrap{display:flex;justify-content:center;gap:2px;letter-spacing:.15em}
.ab-logo{font-family:'Syne';font-weight:800;font-size:36px;color:var(--acc);text-shadow:0 0 30px rgba(201,168,76,.4);display:inline-block;animation:ab-glow 2s ease-in-out infinite alternate}
@keyframes ab-glow{from{text-shadow:0 0 20px rgba(201,168,76,.3)}to{text-shadow:0 0 40px rgba(201,168,76,.6),0 0 60px rgba(201,168,76,.2)}}

.ab-line{height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.2),transparent);margin:0 28px}
.ab-power{position:relative;padding:22px 28px 26px;text-align:center;display:flex;align-items:center;justify-content:center;gap:14px}

.ab-power-logo{flex-shrink:0;width:54px;height:26px;object-fit:contain}
.ab-feat-link{cursor:pointer;color:var(--acc);opacity:.9}

.ab-feat-link .ab-feat-icon{color:var(--acc)}

.ab-more{padding:20px 28px 6px;text-align:center}
.ab-more-title{font-family:'Syne';font-weight:700;font-size:10px;color:var(--t3);letter-spacing:.25em;opacity:.55;margin-bottom:14px}
.ab-qr{position:relative;width:120px;height:120px;margin:0 auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ab-qr-img{display:block;width:120px;height:120px;object-fit:contain;border-radius:10px;background:#fff;padding:6px;border:1px solid rgba(201,168,76,.35);box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .32s cubic-bezier(.2,.8,.2,1),box-shadow .32s}
.ab-qr-tip{margin-top:10px;font-size:9px;color:var(--t3);letter-spacing:.18em;opacity:.28;user-select:none}
@media (hover:hover) and (pointer:fine){

}

#qrLightbox .ql-tip{font-size:12px;color:var(--t3);letter-spacing:.2em;opacity:.5}

/* 移动端适配 */
@media(max-width:600px){

}
/* ===== 播放器横屏/全屏模式 ===== */
.pov.landscape { background: #0b0b0e; }
.pov.landscape .pmain { flex-direction: row; }
.pov.landscape .pvid { width: 100%; height: 100%; }
.pov.landscape .pside { width: 240px; background: rgba(16,16,16,.95); border-left: 1px solid var(--bd); }
.phd{display:none;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:var(--t1);cursor:pointer;font-size:14px;transition:.2s;flex-shrink:0}
.phd:hover{background:var(--acc);color:#080808;border-color:var(--acc)}
.pov.landscape .phd{display:flex}
/* 网页全屏时全部工具按钮可见（截图/录GIF/退出全屏），否则全屏后抓不到帧也退不出 */
.pov.full .phd{display:flex}
/* 全屏三区手势的反馈浮层（音量/亮度/快进提示） */
.pftip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 22px;border-radius:26px;background:rgba(0,0,0,.74);color:#fff;font-size:14px;font-weight:600;z-index:10002;pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap}
.pftip.on{opacity:1}
/* 播放加载覆盖层：视频/iframe 未就绪时显示转圈，避免一片死黑 */
.pov .pvid{position:relative;background:#0b0b0e}
.pvload{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:6;pointer-events:none;background:rgba(11,11,14,.55)}
.pvload .spin{width:38px;height:38px;border-radius:50%;border:3px solid rgba(240,200,80,.22);border-top-color:var(--acc);animation:cmspin .8s linear infinite}
@keyframes cmspin{to{transform:rotate(360deg)}}
/* 横屏时隐藏选集侧边栏，通过按钮展开 */
.pside.collapsed{width:0;border:none;overflow:hidden}
@media(max-width:768px){.pov.landscape .pside{width:100%;position:absolute;bottom:0;left:0;z-index:10;border-top:1px solid var(--bd);max-height:40vh;transform:translateY(100%);transition:transform .3s}.pov.landscape .pside.open{transform:translateY(0)}}
.pov.fullscreen .ph{padding:8px 12px}
.pov.fullscreen .psel{max-width:120px}
/* 手动全屏：覆盖 .pov 的 fixed 容器为最高层 + 撑满整屏，隐藏选集侧栏，视频区铺满，头部贴顶 */
/* 手动全屏：视频层直接 fixed 铺满整屏视口，头部改为绝对浮层盖在视频上（不再挤占布局 → 顶部不留黑条） */
.pov.full{position:fixed;inset:0;z-index:9999;background:#0b0b0e}
.pov.full .pside{display:none}
.pov.full .pmain{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pov.full .pvid{position:fixed !important;inset:0;z-index:1;flex:none;width:100vw;height:100vh;height:100dvh;aspect-ratio:auto;min-height:0;background:#0b0b0e}
.pov.full .pvid video,.pov.full .pvid iframe{width:100%;height:100%;border:none;background:#000}
.pov.full .ph{position:absolute;top:0;left:0;right:0;z-index:10;padding:0 12px;padding-top:max(var(--safe-top,44px),env(safe-area-inset-top,0px));background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0));border-bottom:none;transition:opacity .25s}
.pov.full .ph.phhide{opacity:0;pointer-events:none}
/* 自绘播放控制条：ROM WebView 原生控制栏的全屏键不可靠（controlslist 不生效/点击不触发
   onShowCustomView，实测点击无反应），改 controls=false 全面接管，全屏键直连 cmEnterFull */
.cmcwrap{position:absolute;inset:0;z-index:5;transition:opacity .25s}
.cmcwrap.cmchide{opacity:0;pointer-events:none}
.cmcwrap .cmcenter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;color:#111;box-shadow:0 2px 14px rgba(0,0,0,.45)}
.cmcwrap .cmcenter svg{width:26px;height:26px}
.cmcwrap .cmc{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom,10px));background:linear-gradient(transparent,rgba(0,0,0,.72))}
.cmcwrap .cmt{font-family:'DM Mono',monospace;font-size:11px;color:#fff;flex-shrink:0;opacity:.92}
.cmcwrap .cms{flex:1;height:3px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.35);border-radius:2px;outline:none;margin:0}
.cmcwrap .cms::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--acc,#f0c850)}
.cmcwrap .cmf{flex-shrink:0;width:36px;height:36px;border:none;background:none;color:#fff;font-size:19px;line-height:1;padding:0;cursor:pointer}
/* 控制条内置 截图/录GIF：与进度条同一显隐（全屏点屏幕一起出现，3 秒无操作一起隐藏）。
   头部 .ph 在真机上偶发不随点击唤出，控制条是用户确认可靠的那条显隐链路，按钮放这里最稳。 */
.cmcwrap .cmtool{display:none;flex-shrink:0;width:36px;height:36px;border:none;background:none;color:#fff;line-height:1;padding:0;cursor:pointer;align-items:center;justify-content:center}
.pov.full .cmcwrap .cmtool{display:flex}
.cmcwrap .cmtool svg{width:17px;height:17px;display:block}
.cmcwrap .cmtool.rec{color:#ff6b6b}
/* 截图/GIF 状态提示浮层：不依赖头部可见性，全屏时「录制中/已保存」也能看到 */
#gifToast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);padding:8px 16px;border-radius:20px;background:rgba(0,0,0,.74);color:#fff;font-size:13px;font-weight:600;z-index:10001;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
#gifToast.on{opacity:1}
/* 剧照/海报画廊（详情弹窗）：TMDB images 横向滚动条，点击看大图 */
.mstills{margin-top:14px}
.mstills .mst-hd{font-family:'DM Mono';font-size:11px;color:var(--acc);letter-spacing:.2em;margin-bottom:8px}
.mstills .mstrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}

.mstills .mst img.loaded{opacity:1}
#cmLb{position:fixed;inset:0;z-index:1600;background:rgba(0,0,0,.93);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}

/* 主导航吸顶，滚动时仍可切换 热榜/搜索 */
.mt{position:sticky;top:0;z-index:60;background:linear-gradient(var(--bg) 78%,rgba(8,8,8,0));padding-top:14px;backdrop-filter:blur(6px)}
/* 挖孔屏/刘海安全区：让主导航与左上 logo 避开顶部摄像头区，整体内容下移 */
.mt{padding-top:max(40px,env(safe-area-inset-top,40px),calc(var(--safe-top,0px) + 24px))}
.app-logo{top:max(44px,calc(env(safe-area-inset-top,0px) + 44px),calc(var(--safe-top,0px) + 20px))}
/* 底部操作区/页脚让位手势条 */
.footer{padding-bottom:max(28px,env(safe-area-inset-bottom,28px))}
/* 详情弹窗移动端全屏化，避免小屏拥挤 */
.ov{padding:0}
.mbx{max-width:100%;width:100%;max-height:100vh;max-height:100dvh;height:100vh;height:100dvh;border-radius:0;border:none}
.mcl{top:max(12px,env(safe-area-inset-top));right:12px;width:36px;height:36px;font-size:20px}
/* 播放器头部在窄屏自适应，标题与选集不溢出 */
.ph{flex-wrap:wrap;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top),calc(var(--safe-top,0px) - 20px));padding-bottom:max(10px,env(safe-area-inset-bottom))}
.ptitle{flex:1;min-width:0}
.pright{margin-left:0}
.psel{max-width:150px;flex-shrink:1;min-width:0}
.pes{padding-bottom:max(10px,env(safe-area-inset-bottom))}
}
@media(max-width:480px){
.cg{column-width:120px}
.qr,.dr{grid-template-columns:28px 40px 1fr;gap:6px;padding:7px 8px}
.qp,.dp{width:40px;height:54px}
.qh,.dsc{display:none}
.qn,.dn{font-size:11px}
.pside{height:168px}
.mp{width:92px;height:128px}
.mt2{font-size:15px}
.mbg{height:140px}
.bm{letter-spacing:.32em}
}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--t3);border-radius:2px}

/* ===== 开屏动画 ===== */
.splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s ease,visibility .6s ease}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-logo{font-family:'Syne';font-weight:800;font-size:clamp(18px,4vw,28px);letter-spacing:.35em;color:var(--acc);opacity:0;transform:scale(.9);animation:splashIn .8s cubic-bezier(.22,1,.36,1) forwards}
.splash-sub{font-family:'Noto Serif SC';font-weight:700;font-size:clamp(10px,2vw,14px);color:var(--t1);margin-top:8px;letter-spacing:.2em;opacity:0;animation:splashIn .8s .3s cubic-bezier(.22,1,.36,1) forwards}
.splash-line{width:40px;height:1px;background:linear-gradient(90deg,transparent,var(--acc),transparent);margin-top:12px;opacity:0;animation:splashIn .6s .6s cubic-bezier(.22,1,.36,1) forwards}
@keyframes splashIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.app-logo{position:fixed;top:max(12px,calc(var(--safe-top,0px) + 4px));left:12px;z-index:1000;width:56px;height:56px;border-radius:14px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.5);border:1px solid rgba(201,168,76,.25);background:var(--bg)}
.app-logo img{width:100%;height:100%;object-fit:cover;display:block}
/* 关于弹窗：移动端 max-width:600/768px 的覆写会把它拉成 height:100vh 全屏薄片，
   内容全部顶到屏幕最上方。这里用 id 提高优先级，恢复为垂直居中的卡片。 */
#aboutModal > .mbx.mb,#aboutModal > .mbx{width:94%;max-width:480px;height:auto;max-height:88vh;max-height:88dvh;border-radius:var(--rl);border:1px solid rgba(201,168,76,.15);overflow-y:auto}


/* 全屏时保留截图/录GIF 按钮（旧的 .pov.full .ph .ptools{display:none} 就地作废） */
.pov.full .ph .ptools{display:flex}
/* 铺满模式：视频内联 object-fit:contain 优先级高于样式表，必须 !important 才能覆盖 */
.pov.fillmode .pvid video{object-fit:cover !important}
.pov.fillstretch .pvid video{object-fit:fill !important}
/* iframe 源（m3u8 等）全屏时直接铺满视口（object-fit 对 iframe 无效，故固定铺满整屏即可） */
.pov.full .pvid iframe{width:100vw !important;height:100vh;height:100dvh !important;position:fixed !important;inset:0;z-index:1;border:none}</style>
</head>

/* 代理列表：与直连并行尝试，首个成功即返回。

var LOCAL_PROXY = 'http://127.0.0.1:8788/proxy?url=';
var LOCAL_HLS = 'http://127.0.0.1:8788/hls?url=';
var PROXIES = [
  LOCAL_PROXY,
  'https://corsproxy.io/?',
  'https://api.allorigins.win/raw?url=',
  'https://api.codetabs.com/v1/proxy?quest=',
  'https://images.weserv.nl/?url='
];
function fetchJSON(url) {
  return new Promise(function(resolve, reject) {
    var enc = encodeURIComponent(url);
    var candidates = [url].concat(PROXIES.map(function(p) { return p + enc; }));
    var TIMEOUT = 25000;
    var done = false, settled = 0, errs = [];
    candidates.forEach(function(c, i) {
      var ctrl = new AbortController();
      var timer = setTimeout(function() { ctrl.abort(); }, TIMEOUT);
      fetch(c, { signal: ctrl.signal })
        .then(function(r) { clearTimeout(timer); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function(data) { clearTimeout(timer); if (done) return; done = true; resolve(data); })
        .catch(function(e) {
          clearTimeout(timer);
          errs[i] = (i === 0 ? '直连' : '代理' + i) + ':' + (e && e.message ? e.message : e);
          settled++;
          if (settled >= candidates.length && !done) {
            done = true;
            var tip = '（中国大陆网络下公共代理常被墙。请运行同目录 start-proxy.bat，它会自动打开 http://127.0.0.1:8787/ ，在那个页面里豆瓣即可正常加载）';
            reject(new Error('所有请求方式均失败 ' + tip + ' [' + errs.filter(Boolean).join(' / ') + ']'));
          }
        });
    });
  });
}

      note: d.vod_remarks || '',

      pf: d.vod_play_from || '',
      pu: d.vod_play_url || '',
      pc: json.pagecount || 1
    });
  }
  return out;
}
/* 豆瓣封面统一降级成 320px 小图：原接口给的是 s_ratio_poster 大图(高可达2048)，
   本地代理拉取易失败/超时→全回退灰卡；小图(img3.doubanio.com/view/...)成功率高得多 */
function dbCoverSmall(url) {
  if (!url) return '';
  var u = String(url);
  if (/doubanio\.com/i.test(u)) {
    // 规范化 host + 路径到 view 小图
    var host = (u.match(/img\d?\.doubanio\.com/i) || ['img3.doubanio.com'])[0];
    var m = u.match(/\/view\/[^/]+\/(poster|thumb|l)\/public\/(.+?)$/i);
    if (m) return 'https://' + host + '/view/' + m[1] + '/public/' + m[2];
    var m2 = u.match(/\/view\/photo\/(s_ratio_poster|l)\/public\/(.+?)$/i);
    if (m2) return 'https://' + host + '/view/photo/thumb/public/' + m2[2];
  }
  return u;
}

function parseDbHot(json) {

}
function parseDbTop(json) {
  if (!Array.isArray(json)) return [];
  var out = [];
  for (var i = 0; i < json.length; i++) {
    var d = json[i];
    var r = d.score || (Array.isArray(d.rating) ? (d.rating[0] || 0) : (d.rating ? (d.rating.average || 0) : 0));
    out.push({ id: d.id || '', title: d.title || '未知', img: d.cover_url || d.cover || '', rate: String(r), url: d.url || '', types: d.genres ? d.genres.join(' / ') : '', date: d.release_date || '', eps: d.ep_count || '' });
  }
  return out;
}
function parsePlay(fromStr, urlStr) {
  if (!urlStr) return [];
  var froms = fromStr ? fromStr.split('$$') : ['默认'];
  var groups = urlStr.split('$$$');
  var result = [];
  for (var i = 0; i < groups.length; i++) {
    var parts = groups[i].split('#');
    var eps = [];
    for (var j = 0; j < parts.length; j++) {
      var sp = parts[j].split('$');
      if (sp[1]) eps.push({ name: sp[0] || '播放', url: sp[1] });
    }
    if (eps.length) result.push({ name: froms[i] || ('线路' + (i + 1)), episodes: eps });
  }
  return result;
}

/* 无限滚动哨兵：渲染完若还有更多，则滚到底部自动加载下一页 */

function bindInfiniteScroll(hasMore, loadFn, busyFn, moreFn) {

    io = new IntersectionObserver(function(entries) {
      entries.forEach(function(en) {
        if (!en.isIntersecting) return;
        if (!window._ioLoad || !window._ioLoad.more) return;
        var busy = busyFn ? busyFn() : HOT_BUSY;
        var more = moreFn ? moreFn() : window._ioLoad.more;
        var fn = loadFn ? loadFn : function() { loadHot(G.hp + 1); };
        if (more && !busy) fn();

/* 豆瓣封面图：直连会被图床以 Referer 校验拦截(418)，故去掉 Referer；
   失败再依次走图片代理(weserv)与本地代理(127.0.0.1:8787)，最后兜底占位符 */
function attrEsc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function dbImg(url) {
  if (!url) return '<div class="cdn">🎬</div>';
  return '<img class="dbimg" data-orig="' + attrEsc(url) + '" alt="" loading="lazy" referrerpolicy="no-referrer" crossorigin="anonymous" style="width:100%;height:100%;object-fit:cover;background:#181818;border-radius:6px" onclick="event.stopPropagation()">';
}

/* CMS / 夸克等通用封面：统一走 data-orig + tryLoadImg 兜底链，
   与豆瓣一致地绕过图床防盗链(Referer)与 https 混合内容拦截 */
function cmImg(url) {
  if (!url) return '<div class="cdn">🎬</div>';
  return '<img class="cmimg" data-orig="' + attrEsc(url) + '" alt="" loading="lazy" referrerpolicy="no-referrer" crossorigin="anonymous" style="width:100%;height:100%;object-fit:cover;background:#181818">';
}

/* 资源站 API 常返回相对图片路径（如 /upload/vod/...），在 APK 的 file:// 环境下
   会解析成 file:///android_asset/... 导致封面无法加载；若传入该源的 base(origin)，
   则拼成绝对 URL 再交给 cmImg 走图片代理兜底链 */
function cmsImgUrl(img, base) {
  img = img || '';
  if (img && !/^https?:\/\//i.test(img) && !/^\/\//.test(img) && base) {
    img = base + (img.charAt(0) === '/' ? '' : '/') + img;
  }
  return cmImg(img);
}



function replaceWithPlaceholder(img) {

/* ===== 原生图片桥：APK 内由 AndroidCM.fetchImage 下载（HttpURLConnection 不受 Referer/CORS 限制）=====
   网页层 <img> 无法自定义 Referer，豆瓣图床对无 Referer/服务端代理的请求返回 418/403，
   wsrv/weserv/corsproxy 实测全部拿不下豆瓣封面 → 只能靠原生层下载后回传 base64 data URL。 */
var __cmImgSeq = 0;
window.__cmImgMap = window.__cmImgMap || {};
function cmNativeImg(img, url, onFail) {
  if (/^data:/i.test(url)) return false;
  if (!window.AndroidCM || typeof window.AndroidCM.fetchImage !== 'function') return false;
  if (img.__natTried) return false;
  img.__natTried = true;
  var id = 'ni' + (++__cmImgSeq);
  window.__cmImgMap[id] = { img: img, url: url, onFail: onFail };
  try { window.AndroidCM.fetchImage(id, url); return true; }
  catch (e) { delete window.__cmImgMap[id]; return false; }
}
window.__cmImgDone = function (id, dataUrl) {
  var rec = window.__cmImgMap[id];
  if (!rec) return;
  delete window.__cmImgMap[id];
  var img = rec.img;
  if (!img) { if (rec.onFail) rec.onFail(); return; }
  if (!img.isConnected) return;
  img.onload = null; img.onerror = null;
  if (dataUrl && /^data:image\//i.test(dataUrl)) {
    img.classList.remove('cm-failed');
    img.src = dataUrl;
    img.classList.add('loaded');
    img.__tli = false;
  } else if (rec.onFail) {
    rec.onFail();
  }
};
function tryLoadImg(img) {
  if (img.__tli) return;
  img.__tli = true;

  var raw = img.getAttribute('data-orig');
  if (!raw) { delete img.__tli; return; }

  // 标准化 URL
  var orig = raw.trim();
  if (/^\/\//.test(orig)) orig = 'https:' + orig;

  var idx = 0;
  var timers = [];
  var done = false;

  function loadNext() {
    if (done || idx >= urls.length) return;
    var url = urls[idx++];
    var timedOut = false;
    img.src = url;
    img.classList.remove('loaded');

    var t1 = setTimeout(function() {
      timedOut = true;
      if (done) return;
      if (idx < urls.length) loadNext();
      else { done = true; if (!cmNativeImg(img, orig, function () { replaceWithPlaceholder(img); })) replaceWithPlaceholder(img); }
    }, 3000);
    timers.push(t1);

    img.onload = function() {
      if (timedOut) return;
      done = true;
      for (var j = 0; j < timers.length; j++) clearTimeout(timers[j]);
      img.classList.add('loaded');
      delete img.__tli;
    };

    img.onerror = function() {
      if (timedOut) return;
      clearTimeout(t1);
      if (idx < urls.length) loadNext();
      else { done = true; if (!cmNativeImg(img, orig, function () { replaceWithPlaceholder(img); })) replaceWithPlaceholder(img); }
    };
  }

  // ========== 构造候选 URL 列表 ==========
  // 优先级：本地 8788 代理 > 公共图片代理 > 直连
  // 豆瓣 CDN 对无 Referer 的请求返回 418，直连在浏览器里会失败，
  // 所以公共图片代理（尤其 wsrv.nl）提到最前。
  var urls = [];

  // 相对路径（如本地 logo.jpg）：不进代理，直接用（<img> 相对当前文档解析）
  if (!/^https?:\/\//i.test(orig) && !/^\/\//.test(orig)) {
    img.src = orig;
    img.onload = function() { img.classList.add('loaded'); delete img.__tli; };
    img.onerror = function() { delete img.__tli; };
    return;
  }

  // 0) 本地 8788 代理（最高优先级，带 Referer 能绕过豆瓣防盗链 418；jsDelivr 直连优先故跳过）
  if (/^https?:\/\//i.test(orig) && !/jsdelivr\.net/i.test(orig)) urls.push(LOCAL_PROXY + encodeURIComponent(orig));

  // 0.5) jsDelivr 直连插到候选链最前：公共图片代理(wsrv/weserv/corsproxy)对 jsDelivr 图返回 403，
  //       jsDelivr 本身是 CDN 不需要绕 Referer，直接 unshift 原 URL 让它第一个被尝试
  if (/jsdelivr\.net/i.test(orig)) urls.unshift(orig);

  // 1) 公共图片代理（最优先，能稳定绕过豆瓣 418 / 防盗链）
  urls.push('https://wsrv.nl/?url=' + encodeURIComponent(orig) + '&w=320');
  urls.push('https://images.weserv.nl/?url=' + encodeURIComponent(orig.replace(/^https?:\/\//, '')));
  urls.push('https://corsproxy.io/?' + encodeURIComponent(orig));

  // 2) 直连（最后兜底）
  if (/^https:\/\//i.test(orig)) urls.push(orig);
  if (/^http:\/\//i.test(orig)) urls.push(orig.replace(/^http:\/\//i, 'https://'));
  if (/^http:\/\//i.test(orig)) urls.push(orig);

  // 3) 豆瓣多 host 切换（小图变体）
  if (/img\d?\.doubanio\.com/i.test(orig)) {
    ['img3.doubanio.com', 'img9.doubanio.com', 'img1.doubanio.com', 'img2.doubanio.com'].forEach(function(host) {
      var alt = orig.replace(/img\d?\.doubanio\.com/i, host);
      var altW = 'https://wsrv.nl/?url=' + encodeURIComponent(alt) + '&w=320';
      if (urls.indexOf(altW) === -1) urls.push(altW);
      if (alt !== orig && urls.indexOf(alt) === -1) urls.push(alt);
    });
  }

  // 4) 豆瓣多 host 也走本地代理（绕过 418）
  if (/img\d?\.doubanio\.com/i.test(orig)) {
    var localAlt = LOCAL_PROXY + encodeURIComponent(orig.replace(/img\d?\.doubanio\.com/i, 'img3.doubanio.com'));
    if (urls.indexOf(localAlt) === -1) urls.push(localAlt);
  }

  // 去重
  urls = urls.filter(function(u, i) { return urls.indexOf(u) === i; });

  console.log('[CM] tryLoadImg:', orig, urls.length, 'candidates');
  if (cmNativeImg(img, orig, function () { loadNext(); })) return;
  loadNext();
}

  fetchJSON(src.list(cat.t, G.hp))
    .then(function(json) {
      var items = parseCMS(json);

/* ===== 综合推荐（多源聚合，铺满首页，支持无限滚动） =====
   电影优先渐进上屏：请求全部并行发出，渲染按「豆瓣电影 → 资源站电影 → 电视剧+夸克」

var MIX_PAGE = 0, MIX_BUSY = false, MIX_MORE = false, MIX_SEEN = {}, MIX_GEN = 0;
var MI_DB = [], MI_QK = [], MI_CMS = []; // 独立子数组，不挂 MI 实例，避免 concat 重赋值丢失
function loadMix(batch) {
  MIX_PAGE = batch || 0;
  var append = MIX_PAGE > 0;
  if (append && MIX_BUSY) return;
  console.log('[CM] loadMix batch', MIX_PAGE);
  var myGen = ++MIX_GEN; // 代次令牌：切换分类/发起新批次后，旧回调全部作废
  if (append) showLoadMore();
  else {
    MIX_SEEN = {}; MI = []; MI_DB = []; MI_QK = []; MI_CMS = [];
    document.getElementById('content').innerHTML = loadingHTML('正在加载电影资源...');
  }
  MIX_BUSY = true;
  var p = MIX_PAGE;
  // 去重（按标题归一化）
  var norm = function(s) { return (s || '').toLowerCase().replace(/[\s\u3000\u00b7\u301c\uff5c\u2014\u2013\u002d]/g, ''); };
  function push(kind, ref, full, arr) {
    var key = norm(full.title);
    if (!key || MIX_SEEN[key]) return;
    MIX_SEEN[key] = true;
    arr.push({ kind: kind, idx: ref, title: full.title, img: full.img, rate: full.rate || '', sub: full.sub || '', badge: full.badge || '', base: full.base || '' });
  }
  function alive() { return myGen === MIX_GEN && G.mode === 'hot' && G.cat === 'mix'; }
  function flatten(res) { var out = []; (res || []).forEach(function(group) { group.forEach(function(a) { a.forEach(function(it) { out.push(it); }); }); }); return out; }
  function paint(dbItems, cmsItems, qkItems) {
    var dbStart = MI_DB.length, qkStart = MI_QK.length, cmsStart = MI_CMS.length;
    var arr = [];
    dbItems.forEach(function(d, i) {
      var sub = [d.types, d.date].filter(Boolean).join(' · ');
      push('db', dbStart + i, { title: d.title, img: d.img, rate: d.rate, sub: sub, badge: d.rate ? '豆瓣 ' + parseFloat(d.rate).toFixed(1) : '' }, arr);
    });
    qkItems.forEach(function(q, i) {
      push('qk', qkStart + i, { title: q.title, img: q.img, sub: q.tag || '', badge: q.type === '新' ? 'NEW' : (q.type === '热' ? 'HOT' : '') }, arr);
    });
    cmsItems.forEach(function(c, i) {
      var sub = [c.type, c.year, c.__src].filter(Boolean).join(' · ');
      push('cms', cmsStart + i, { title: c.title, img: c.img, sub: sub, badge: c.__src || '', base: c.__base || '' }, arr);
    });
    MI_DB = MI_DB.concat(dbItems);
    MI_QK = MI_QK.concat(qkItems);
    MI_CMS = MI_CMS.concat(cmsItems);
    return arr;
  }
  var firstPainted = false, batchGot = 0;
  function flush(arr) {
    if (!alive() || !arr.length) return;
    var before = MI.length;
    MI = MI.concat(arr);
    batchGot += arr.length;
    if (!firstPainted) {
      firstPainted = true;
      if (p === 0) renderMix(MI, 0, false, true); else renderMix(MI, before, true, true);
    } else {
      renderMix(MI, before, true, true);
    }
  }
  // 1) 豆瓣热门电影（带评分），每批 40 条 —— 单请求最快，第一优先上屏
  var dbUrl = 'https://movie.douban.com/j/search_subjects?type=movie&tag=%E7%83%AD%E9%97%A8&page_limit=40&page_start=' + (p * 40);
  var pDb = fetchJSON(dbUrl).then(function(j) { return parseDbHot(j); }).catch(function() { return []; });
  // 2) 资源站按类型拆分：电影(t=1) 先于 电视剧(t=2) 上屏
  function cmsFetch(t) {
    return Promise.all(SRC.map(function(s) {
      var listUrl = s.list(t, p + 1);
      var base;
      try { base = (new URL(listUrl)).origin; } catch (e) { base = ''; }
      return fetchJSON(listUrl).then(function(j) {
        var items = parseCMS(j);
        for (var k = 0; k < items.length; k++) { items[k].__src = s.name; if (!items[k].__base) items[k].__base = base; }
        return items;

    }));
  }
  var pCmsMovie = cmsFetch(1);
  var pCmsTV = cmsFetch(2);
  // 3) 夸克热播（仅首批，随最后一批上屏）
  var pQk = p === 0 ? fetchJSON(QKURL).then(function(j) { return parseQK(j); }).catch(function() { return []; }) : Promise.resolve([]);
  // 渲染链：请求并行、上屏串行（电影 → 资源站电影 → 电视剧+夸克）
  var chain = Promise.resolve();
  chain = chain.then(function() { return pDb.then(function(db) { if (alive()) flush(paint(db || [], [], [])); }); });
  chain = chain.then(function() { return pCmsMovie.then(function(res) { if (alive()) flush(paint([], flatten(res), [])); }); });
  chain = chain.then(function() {
    return Promise.all([pCmsTV, pQk]).then(function(res) {
      if (!alive()) return;
      flush(paint([], flatten(res[0]), res[1] || []));
      if (!firstPainted) {
        document.getElementById('content').innerHTML = '<div class="msg">' + icoSVG(ICO.empty) + '<div class="ttl">暂无数据</div><div class="desc">可点击分类切换其他榜单</div></div>';
        MIX_MORE = false;
      }
    });
  });
  chain.catch(function() {})
    .then(function() {
      if (myGen !== MIX_GEN) return;
      MIX_BUSY = false;
      MIX_MORE = batchGot > 0;
      if (firstPainted) updateLoader(MIX_MORE);
    });
}

/* ===== 加载豆瓣 ===== */
function loadDb(start) {
  G.db = start || 0;
  document.getElementById('content').innerHTML = '<div class="msg"><div class="ring"></div><div class="desc">加载豆瓣...</div></div>';
  var dt = curDb();
  if (!dt) return;
  var url = dt.url.replace('{s}', G.db);
  console.log('[CM] loadDb:', dt.name);
  fetchJSON(url)
    .then(function(json) {
      var items = (G.cat === 'db_hot') ? parseDbHot(json) : parseDbTop(json);
      if (!items.length) {
        if (G.db === 0) {
          document.getElementById('content').innerHTML = '<div class="msg">' + icoSVG(ICO.empty) + '<div class="ttl">暂无数据</div></div>';
        }
        return;
      }
      /* 去重：个别代理/缓存可能把 start=N 页返回成第一页，直接拼接会同一部电影出现两行 */
      var fresh = items;
      if (G.db > 0) {
        var seen = {};
        DI.forEach(function(d) { seen[d.id || (d.title + '|' + d.date)] = 1; });
        fresh = items.filter(function(d) {
          var k = d.id || (d.title + '|' + d.date);
          if (seen[k]) return false;
          seen[k] = 1;
          return true;
        });
        if (!fresh.length) {
          if (G.db <= 40) { loadDb(G.db + 20); return; } /* 整页重复（代理返回旧页）→ 自动跳下一页，最多跳两次 */
          renderDb(DI, false);
          return;
        }
      }
      DI = (G.db === 0) ? fresh : DI.concat(fresh);
      renderDb(DI, items.length >= 20);
    })
    .catch(function(e) {
      console.error('[CM] loadDb error:', e);
      document.getElementById('content').innerHTML = '<div class="msg">' + icoSVG(ICO.warn) + '<div class="ttl">豆瓣加载失败</div><div class="err">' + esc(e.message) + '</div><p style="font-size:11px;color:var(--t3);margin-top:8px">请双击运行同目录 <strong>start-proxy.bat</strong>，它会自动打开 <strong>http://127.0.0.1:8787/</strong>，在那个页面里豆瓣即可正常加载（不要用预览页里的地址）。</p><button type="button" class="abtn adb" onclick="loadDb(0)">重试</button></div>';
    });
}

/* ===== 搜索（多源并行，任一源有结果自动切换过去） ===== */
function doSearch(q) {
  if (!q || !q.trim()) return;
  q = q.trim();
  G.lq = q;
  document.getElementById('searchInput').value = q;
  var btn = document.getElementById('searchBtn');
  btn.disabled = true;
  btn.textContent = '搜索中...';
  document.getElementById('content').innerHTML = '<div class="msg"><div class="ring"></div><div class="desc">搜索 "' + esc(q) + '" ...</div></div>';
  document.getElementById('resultBar').innerHTML = '';
  console.log('[CM] Search:', q);

  // 多源并行搜索：所有 SRC 同时查，按「有播放地址的条目数」择优取源
  var srcs = SRC.slice();
  var settled = 0;
  var found = null; // { src, items, playable }
  srcs.forEach(function(s) {
    fetchJSON(s.url(q))
      .then(function(json) {
        var items = parseCMS(json);
        // 过滤掉无播放地址的脏条目，统计可播放数量
        var playable = items.filter(function(it) { return it.pu; }).length;
        // 择优：有播放地址的源优先；同分取条目多的
        if (items.length && playable > 0 && (!found || playable > found.playable)) {
          found = { src: s, items: items, playable: playable };
        } else if (items.length && found && found.playable === 0) {
          // 还没更好的，先记着（兜底）
          if (!found || found.playable === 0) found = { src: s, items: items, playable: playable };
        }
        settled++;
        if (settled === srcs.length) finishSearch(found, q);
      })
      .catch(function() {
        settled++;
        if (settled === srcs.length) finishSearch(found, q);
      });
  });

  function finishSearch(found, q) {
    if (found && found.items.length) {
      // 优先展示有播放地址的条目；全都没有则保留原序
      var items = found.playable > 0
        ? found.items.filter(function(it) { return it.pu; })
        : found.items;
      G.src = found.src.id;
      CI = items;
      document.getElementById('resultBar').innerHTML =
        '<div class="rbar"><div><span class="rk">"' + esc(q) + '"</span> ' +
        '<span class="rc">' + esc(found.src.name) + ' · ' + items.length + ' 条（可播 ' + found.playable + '）</span></div>' +
        '<button type="button" class="clr" onclick="clearSearch()">清除</button></div>';
      renderCards(items, false);
      // 识别分享卡：识图扫码后自动打开目标影片详情（免打字）
      if (window.__cmAutoOpenTitle) {
        var want = String(window.__cmAutoOpenTitle); window.__cmAutoOpenTitle = '';
        var hit = -1;
        for (var i = 0; i < CI.length; i++) { if ((CI[i].title || '').trim() === want) { hit = i; break; } }
        if (hit < 0) { for (var j = 0; j < CI.length; j++) { if ((CI[j].title || '').indexOf(want) >= 0) { hit = j; break; } } }
        if (hit >= 0) openCMS(hit);
        else gifStat('已搜索「' + want + '」，请在结果里点开详情');
      }
    } else {
      document.getElementById('content').innerHTML =
        '<div class="msg">' + icoSVG(ICO.search) + '<div class="ttl">未找到 "' + esc(q) + '"</div>' +
        '<div class="desc">所有数据源均无结果，可尝试更换关键词或切换数据源</div></div>';
    }
    btn.disabled = false;
    btn.textContent = '搜索';
  }
}

function clearSearch() {
  document.getElementById('resultBar').innerHTML = '';
  document.getElementById('content').innerHTML = '<div class="msg">' + icoSVG(ICO.search) + '<div class="ttl">搜索你想看的影视</div><div class="desc">输入名称，点击即可在线播放</div></div>';
  document.getElementById('searchInput').value = '';
  document.getElementById('searchInput').focus();
}

/* ===== 识别分享卡 / 生成分享卡 =====
   与超级便利贴同款玩法：详情页可生成带识别二维码的分享卡图片；
   别人保存图片后，在「搜索」页点相机按钮选图 → 原生 zxing 解码 → 自动搜索并打开详情。
   二维码 payload 用极简格式 CINEMARK|片名|年份（远小于 zxing EC 上限，杜绝超长 payload 解码失败）。 */
function cmScanCard() {
  var inp = document.getElementById('scanCardInput');
  if (!inp) return;
  if (!window.AndroidCM || typeof AndroidCM.decodeQr !== 'function') { gifStat('识别分享卡请在 APP 内使用'); return; }
  inp.click();
}
function cmBindScanInput() {
  var inp = document.getElementById('scanCardInput');
  if (!inp || inp.__bound) return;
  inp.__bound = true;
  inp.addEventListener('change', function() {
    var f = inp.files && inp.files[0];
    inp.value = '';
    if (!f) return;
    gifStat('正在识别分享卡...');
    var r = new FileReader();
    r.onload = function() {
      var b64 = String(r.result || '').split(',')[1] || '';
      var payload = '';
      try { payload = AndroidCM.decodeQr(b64) || ''; } catch (e) {}
      cmHandleScanPayload(payload);
    };
    r.onerror = function() { gifStat('图片读取失败，请重试'); };
    r.readAsDataURL(f);
  });
}
function cmHandleScanPayload(p) {
  p = String(p || '').trim();
  if (!p) { gifStat('未识别到二维码，请选清晰一些的图片'); return; }
  if (p.indexOf('CINEMARK|') !== 0) { gifStat('这不是影视热榜的分享卡'); return; }
  var parts = p.split('|');
  var title = (parts[1] || '').trim();
  if (!title) { gifStat('分享卡内容为空'); return; }
  window.__cmAutoOpenTitle = title;
  try { closePlayer(true); } catch (e) {}
  try { closeModal(true); } catch (e) {}
  switchMode('search');
  doSearch(title);
}
/* 分享卡海报：APK 走原生 fetchImage（无 Referer/CORS 限制）拿 dataURL，canvas 不受污染；
   网页端 crossOrigin 直连（能过 CORS 就画，过不了就出纯底卡）。 */
function cmShareCardPoster(url, cb) {
  if (!url || !/^(https?:)?\/\//i.test(url)) { cb(null); return; }
  var fin = false;
  function done(d) {
    if (!fin) { fin = true; cb(d); }
    // 海报加载失败时给用户明确提示（纯文字版分享卡仍能生成）
    if (d === null) {
      try { gifStat('海报跨域受限，已用纯文字版分享卡'); } catch (e) {}
    }
  }
  var img = document.createElement('img');
  img.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px';
  img.onload = function() { var ok = /^data:/i.test(img.src); done(ok ? img.src : null); setTimeout(function() { img.remove(); }, 50); };
  img.onerror = function() { done(null); setTimeout(function() { img.remove(); }, 50); };
  document.body.appendChild(img);
  if (window.AndroidCM && typeof AndroidCM.fetchImage === 'function') {
    var id = 'ni' + (++__cmImgSeq);
    window.__cmImgMap[id] = { img: img, url: url, onFail: function() { webRetry(); } };
    try { AndroidCM.fetchImage(id, url); } catch (e) { delete window.__cmImgMap[id]; webRetry(); }
  } else webRetry();
  function webRetry() {
    var i2 = document.createElement('img');
    i2.crossOrigin = 'anonymous';
    i2.referrerPolicy = 'no-referrer';
    i2.onload = function() { done(i2.naturalWidth ? i2.src : null); };
    i2.onerror = function() { done(null); };
    i2.src = url;
  }
}
function cmMakeShareCard() {
  if (!PI || !PI.title) { gifStat('先打开影片详情再生成分享卡'); return; }
  if (!window.AndroidCM || typeof AndroidCM.makeQr !== 'function') { gifStat('生成分享卡请在 APP 内使用'); return; }
  gifStat('正在生成分享卡...');
  var title = String(PI.title).trim();
  var year = PI.year || '';
  var type = PI.type || '';
  var area = PI.area || '';
  var rateData = cmFetchRatingData(PI);
  var payload = 'CINEMARK|' + title + (year ? '|' + year : '');
  var qrB64 = '';
  try { qrB64 = AndroidCM.makeQr(payload, 360) || ''; } catch (e) {}
  // 1. 取 TMDB 多图（封面+剧照）
  cmFetchCardImages(title, year, 4, function(images) {
    // 2. 取 QR
    if (!qrB64) { cmPaintShareCard(title, year, type, area, rateData, images, null); return; }
    var q = new Image();
    q.onload = function() { cmPaintShareCard(title, year, type, area, rateData, images, q); };
    q.onerror = function() { cmPaintShareCard(title, year, type, area, rateData, images, null); };
    q.src = 'data:image/png;base64,' + qrB64;
  });
}
function cmLoadQrAndPaint(qrB64, posterImg) {
  if (!qrB64) { cmPaintShareCard(posterImg, null); return; }
  var q = new Image();
  q.onload = function() { cmPaintShareCard(posterImg, q); };
  q.onerror = function() { cmPaintShareCard(posterImg, null); };

}

/* ===== 分享卡增强：多图（海报+剧照）+ 多源评分 ===== */
/* cmFetchCardImages：取最多 N 张图（封面+剧照）用于分享卡
   优先读剧照缓存（cmStills）避免重复请求；缓存不存在时同步走 TMDB API。
   结果格式：[{url:'https://image.tmdb.org/t/p/original/...'}, ...] */
function cmFetchCardImages(title, year, maxCount, cb) {
  if (!title) { cb([]); return; }
  var t = cmCleanTitle(title);
  if (!t) { cb([]); return; }
  maxCount = maxCount || 4;
  // 1. 优先读剧照缓存（initCmStills 已填充，包含海报+剧照）
  try {
    var cacheKey = 'cmStills:' + t + ':' + (year || '');
    var cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
    if (cached && cached.list && cached.list.length) {
      var out = [];
      for (var i = 0; i < cached.list.length && out.length < maxCount; i++) {
        var item = cached.list[i];
        var size = item.k === 'p' ? 'original' : 'w780';
        out.push({ url: 'https://image.tmdb.org/t/p/' + size + item.p });
      }
      if (out.length) { cb(out); return; }
    }
  } catch (e) {}
  // 2. 缓存不存在则同步从 TMDB 取
  var mt = 'movie';
  fetchJSON('https://api.themoviedb.org/3/search/movie?api_key=' + CM_TMDB_KEY + '&language=zh-CN&query=' + encodeURIComponent(t))
    .then(function(d) {
      var pick = d.results && d.results[0];
      if (!pick) throw new Error('no result');
      mt = pick.media_type || (pick.first_air_date ? 'tv' : 'movie');
      return fetchJSON('https://api.themoviedb.org/3/' + mt + '/' + pick.id + '/images?api_key=' + CM_TMDB_KEY);
    })
    .then(function(im) {
      var posters = (im && im.posters) || [];
      var bds = (im && im.backdrops) || [];
      function firstByLang(a) {
        for (var i = 0; i < a.length; i++) if (a[i].iso_639_1 === 'zh') return a[i];
        for (var j = 0; j < a.length; j++) if (!a[j].iso_639_1) return a[j];
        return a[0] || null;
      }
      var pz = firstByLang(posters);
      var list = [];
      if (pz) list.push({ k: 'p', p: pz.file_path });
      var sb = bds.slice().sort(function(a, b) {
        var za = a.iso_639_1 === 'zh' ? 1 : 0, zb = b.iso_639_1 === 'zh' ? 1 : 0;
        return (zb - za) || ((b.vote_average || 0) - (a.vote_average || 0));
      });
      for (var i = 0; i < sb.length && list.length < maxCount; i++) list.push({ k: 'b', p: sb[i].file_path });
      cb(list.map(function(it) {
        return { url: 'https://image.tmdb.org/t/p/original' + it.p };
      }));
    })
    .catch(function() { cb([]); });
}

/* cmFetchRatingData：从 PI 已有字段构建评分数据
   PI.rate 来自豆瓣；TMDB/IMDb 需在 openCMS 时额外填充（本版本优先展示已有数据） */
function cmFetchRatingData(pi) {
  if (!pi) return { douban: '', tmdb: '', imdb: '' };
  var r = {
    douban: parseFloat(pi.rate) || 0,
    tmdb: 0,
    imdb: 0
  };
  // 尝试从 PI.tmdbId 反向从缓存读 vote_average（如果有）
  try {
    var key = 'cmStills:' + (cmCleanTitle(pi.title) || '') + ':' + (pi.year || '');
    var c = JSON.parse(localStorage.getItem(key) || 'null');
    if (c && c.list) {
      // 剧照缓存不含评分，暂跳过
    }
  } catch (e) {}
  // 若 PI 自带 tmdb/vote 字段则用
  if (pi.tmdbRate) r.tmdb = parseFloat(pi.tmdbRate) || 0;
  if (pi.imdbRate) r.imdb = parseFloat(pi.imdbRate) || 0;
  return r;
}

function cmPaintShareCard(title, year, type, area, rateData, images, qrImg) {
  var W = 720, H = 1080;
  // 图元
  function fillRoundedRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function makeCard() {
    var c = document.createElement('canvas'); c.width = W; c.height = H;
    var x = c.getContext('2d');
    // 背景
    x.fillStyle = '#0b0b0e'; x.fillRect(0, 0, W, H);
    // 金色边框
    x.strokeStyle = 'rgba(201,168,76,.5)'; x.lineWidth = 2;
    fillRoundedRect(x, 20, 20, W - 40, H - 40, 16); x.stroke();
    x.strokeStyle = 'rgba(201,168,76,.2)'; x.lineWidth = 1;
    fillRoundedRect(x, 30, 30, W - 60, H - 60, 12); x.stroke();
    // 标题区
    x.textAlign = 'center';
    x.fillStyle = '#c9a84c'; x.font = 'bold 36px sans-serif';
    x.fillText('CINEMARK', W / 2, 62);
    x.fillStyle = '#8a8a92'; x.font = '22px sans-serif';
    x.fillText('影视热榜 · 分享卡', W / 2, 90);
    // 电影名
    var safeTitle = (title || '').replace(/['"\\]/g, '');
    var displayTitle = safeTitle.length > 16 ? safeTitle.slice(0, 15) + '…' : safeTitle;
    x.fillStyle = '#f2ede1'; x.font = 'bold 40px sans-serif';
    x.fillText(displayTitle, W / 2, 150);
    // 元信息
    var metas = [year, type, area].filter(Boolean).join(' · ');
    x.fillStyle = '#9a9aa2'; x.font = '22px sans-serif';
    x.fillText(metas || '多源聚合 · 搜索即看', W / 2, 188);
    // 四图网格
    var gw = 320, gh = 180, gap = 12, startX = (W - gw * 2 - gap) / 2, startY = 220;
    var loaded = 0, total = Math.min((images || []).length, 4);
    var canvases = [];
    for (var i = 0; i < 4; i++) {
      var col = i % 2, row = Math.floor(i / 2);
      var ix = startX + col * (gw + gap), iy = startY + row * (gh + gap);
      var img = document.createElement('canvas'); img.width = gw; img.height = gh;
      var ictx = img.getContext('2d');
      ictx.fillStyle = '#15121c'; ictx.fillRect(0, 0, gw, gh);
      ictx.fillStyle = '#555'; ictx.font = '18px sans-serif'; ictx.textAlign = 'center';
      ictx.fillText('加载中...', gw / 2, gh / 2 + 6);
      canvases.push(img);
      if (i < total && images[i]) {
        var imgEl = new Image(); imgEl.crossOrigin = 'anonymous';
        imgEl.onload = function(i2, cv, ctx2) {
          return function() {
            var sw = imgEl.naturalWidth, sh = imgEl.naturalHeight;
            var ratio = Math.max(sw / cv.width, sh / cv.height);
            var dw = sw / ratio, dh = sh / ratio;
            ctx2.clearRect(0, 0, cv.width, cv.height);
            ctx2.drawImage(imgEl, (cv.width - dw) / 2, (cv.height - dh) / 2, dw, dh);
            loaded++;
            if (loaded === total) { /* all loaded */ }
          };
        }(i, img, ictx);
        imgEl.onerror = function() { /* keep placeholder */ };
        imgEl.src = images[i].url;
      }
    }
    // 评分条
    var ry = 220 + 2 * (gh + gap) + 20;
    x.textAlign = 'center'; x.fillStyle = '#c9a84c'; x.font = 'bold 20px sans-serif';
    x.fillText('评分', W / 2, ry);
    ry += 32;
    var ratings = [];
    if (rateData && rateData.douban) ratings.push({ src: '豆瓣', val: rateData.douban.toFixed(1), color: '#d2d531' });
    if (rateData && rateData.tmdb) ratings.push({ src: 'TMDB', val: (rateData.tmdb / 2).toFixed(1), color: '#21d07a' });
    if (rateData && rateData.imdb) ratings.push({ src: 'IMDb', val: rateData.imdb.toFixed(1), color: '#f5c518' });
    var ratingW = 180, ratingTotalW = ratings.length * (ratingW + 16);
    var rx = (W - ratingTotalW) / 2;
    for (var ri = 0; ri < ratings.length; ri++) {
      var rd = ratings[ri];
      fillRoundedRect(x, rx, ry, ratingW, 36, 8);
      x.fillStyle = '#1a1a2e'; x.fill();
      x.strokeStyle = rd.color; x.lineWidth = 1.5; fillRoundedRect(x, rx, ry, ratingW, 36, 8); x.stroke();
      x.fillStyle = rd.color; x.font = 'bold 18px sans-serif'; x.textAlign = 'left';
      x.fillText(rd.val, rx + 12, ry + 25);
      x.fillStyle = '#8a8a92'; x.font = '14px sans-serif';
      x.fillText(rd.src, rx + ratingW - 40, ry + 24);
      rx += ratingW + 16;
    }
    // QR 码
    var qrSize = 160, qrX = W - qrSize - 60, qrY = H - qrSize - 100;
    if (qrImg && qrImg.naturalWidth) {
      x.fillStyle = '#ffffff'; fillRoundedRect(x, qrX - 8, qrY - 8, qrSize + 16, qrSize + 16, 8); x.fill();
      x.drawImage(qrImg, qrX, qrY, qrSize, qrSize);
      x.textAlign = 'center'; x.fillStyle = '#c9a84c'; x.font = '16px sans-serif';
      x.fillText('扫码直达 · 免打字', qrX + qrSize / 2, qrY + qrSize + 24);
    }
    return c;
  }
  var card = null;
  try { card = makeCard(); } catch (e) { card = null; }
  if (!card) { gifStat('分享卡生成失败'); return; }
  cmShowShareCard(card.toDataURL('image/jpeg', 0.92));
}

/* 列表接口返回的条目常常缺少 vod_pic/desc/actor（如量子站当前返回 0-3 条且全空），
   用各源的「按名查详情」接口（ac=detail&wd=）补齐缺失字段，再刷一次封面与详情。
   每个条目最多等 8 秒；全部失败则保留占位。已 enriched 的条目直接跳过。 */
function enrichCMSWithDetails(items, src, onDone) {
  if (!items || !items.length || !src || typeof src.url !== 'function') { if (onDone) onDone(0); return; }
  var pending = 0, ok = 0;
  var finish = function() {
    pending--;
    if (pending <= 0) { if (onDone) onDone(ok); }
  };
  items.forEach(function(it) {
    if (it._enriched) return;
    it._enriched = true; // 防止并发重复
    var key = (it.title || '').trim();
    if (!key) { finish(); return; }
    pending++;
    var settled = false;
    var guard = setTimeout(function() { if (!settled) { settled = true; finish(); } }, 8000);
    fetchJSON(src.url(key)).then(function(json) {
      if (settled) return;
      var list = (json && json.list) || [];
      // 找同名条目（标题包含即可，避免误配别的源的同片）
      var pick = null;
      for (var i = 0; i < list.length; i++) {
        if (list[i] && list[i].vod_name && list[i].vod_name === key) { pick = list[i]; break; }
      }
      if (!pick && list.length === 1) pick = list[0];
      if (pick) {
        ok++;
        var changed = false;
        if (!it.img && pick.vod_pic) { it.img = pick.vod_pic; changed = true; }
        if (!it.desc && (pick.vod_content || pick.vod_blurb)) { it.desc = String(pick.vod_content || pick.vod_blurb || '').replace(/<br\s*\/?>(?!\s*$)/gi, '\n').replace(/<[^>]+>/g, ''); changed = true; }
        if (!it.actor && pick.vod_actor) { it.actor = pick.vod_actor; changed = true; }
        if (!it.director && pick.vod_director) { it.director = pick.vod_director; changed = true; }
        if (!it.year && pick.vod_year) { it.year = pick.vod_year; changed = true; }
        if (!it.pu && pick.vod_play_url) { it.pu = pick.vod_play_url; it.pf = pick.vod_play_from || it.pf; changed = true; }
      }
      settled = true; clearTimeout(guard); finish();
    }).catch(function() {
      if (settled) return;
      settled = true; clearTimeout(guard); finish();
    });
  });
}

/* 详情页补齐后，若打开的是 CMS modal，则原地刷新封面+简介+演职员 */

      castHTML += '<div class="mc-row"><span class="mc-label">主演</span><span class="mc-val">' + ch + (aRest > 0 ? '<span class="mc-rest">' + aRest + ' 等</span>' : '') + '</span></div>';

  var oldCast = body.querySelector('.mcast'); if (oldCast) oldCast.remove();

/* ===== 演员推荐：点击详情页里的导演/主演，查 TA 参演的其它片（多源并行 + 豆瓣兜底） ===== */
var ACTOR_RECENT = {}; // { actorName: [titles] } 缓存
function searchActor(name, role) {
  if (!name || name.length < 2) return;
  var wrap = document.getElementById('actorRecWrap');
  if (!wrap) {
    wrap = document.createElement('div');
    wrap.id = 'actorRecWrap';
    var mbd = document.getElementById('modalBody').querySelector('.mbd');
    if (mbd) mbd.appendChild(wrap);
  }
  wrap.style.display = 'block';
  wrap.innerHTML = '<div class="msc" style="margin-top:10px">▸ ' + esc(role) + '「' + esc(name) + '」参演的其它作品</div>' +
    '<div class="meg" id="actorRecLoading"><span class="mc-load">正在搜索…</span></div>';

  // 排除当前正在看的这部，避免自我推荐
  var curTitle = (PI && PI.title || '').trim();
  var pending = 0, results = [], rendered = false;
  function renderAll() {
    var seen = {};
    var all = [];
    results.forEach(function(r) {
      r.items.forEach(function(it) {
        var key = (it.title || '').toLowerCase().replace(/\s/g, '');
        if (!key || seen[key]) return;
        seen[key] = true;
        if ((it.title || '').trim() === curTitle) return; // 排除当前片
        all.push({ title: it.title, img: it.img, sub: [it.type, it.year, it.__src].filter(Boolean).join(' · '), playable: !!it.pu, item: it });
      });
    });
    all.sort(function(a, b) { return (b.playable ? 1 : 0) - (a.playable ? 1 : 0); });
    var show = all.slice(0, 8);
    var box = document.getElementById('actorRecLoading');
    if (!box) return;
    if (!show.length) {
      box.innerHTML = '<span class="mc-empty">未搜到 ' + esc(name) + ' 参演的其它可播作品，可用顶部搜索再试一次</span>';
    } else {
      var html = '<div class="actorRecGrid">';
      show.forEach(function(m, i) {
        html += '<div class="ar-card" onclick="openActorRec(' + i + ')">' +
          '<div class="ar-img">' + cmImg(m.img) + '<div class="ar-badge">' + esc(m.playable ? '可播' : (m.__src || '资源')) + '</div></div>' +
          '<div class="ar-title">' + esc(m.title) + '</div>' +
          (m.sub ? '<div class="ar-sub">' + esc(m.sub) + '</div>' : '') +
          '</div>';
      });
      html += '</div>';
      box.innerHTML = html;
      ACTOR_RECENT[name] = show;
      ACTOR_RECENT._lastGrid = show;
      box.querySelectorAll('img[data-orig]').forEach(function(im) { tryLoadImg(im); });
    }
    rendered = true;
  }
  function settle() {
    pending--;
    if (pending > 0) return;
    // 全部到齐才渲染；若中途已渲染过（豆瓣追加），重渲染以合并
    renderAll();
  }
  // 并行查 4 个资源站
  SRC.forEach(function(s) {
    pending++;
    fetchJSON(s.url(name)).then(function(json) {
      var items = parseCMS(json).filter(function(it) { return it.pu; }).slice(0, 6);
      items.forEach(function(it) { it.__src = s.name; });
      results.push({ items: items });
      settle();
    }).catch(settle);
  });
  // 豆瓣兜底：按演员搜片（search_subjects 关键词），延迟启动避免抢资源站
  setTimeout(function() {
    pending++;
    var dbUrl = 'https://movie.douban.com/j/search_subjects?type=movie&tag=' + encodeURIComponent(name) + '&page_limit=10&page_start=0';
    fetchJSON(dbUrl).then(function(j) {
      var items = (j.subjects || []).map(function(d) {
        return { title: d.title, img: d.cover, type: '', year: (d.title_year || '').slice(0, 4), __src: '豆瓣', playable: false,
                 item: { title: d.title, img: d.cover, url: d.url } };
      }).filter(function(it) { return it.img; });
      results.push({ items: items });
      settle();
    }).catch(settle);
  }, 1200);
}
function openActorRec(i) {
  var m = ACTOR_RECENT._lastGrid && ACTOR_RECENT._lastGrid[i];
  if (!m) return;
  if (m.item && m.item.pu) {
    // 进入完整详情弹窗（含导演/简介/选集列表，点选集即可播放）
    CI.push(m.item);
    openCMS(CI.length - 1);
    return;
  }
  // 无播放地址：豆瓣兜底或站内搜索
  if (m.item && m.item.url) { window.open(m.item.url, '_blank'); return; }
  doSearch(m.title);
}

/* ===== 换源播放：当前条目无播放地址时，并行搜其他源找可播的 ===== */
function switchSourceFor(item, placeholderEl) {
  if (item._switching || item._switched) return;
  item._switching = true;
  placeholderEl.innerHTML = '<div style="font-size:12px;color:var(--acc);padding:8px 0">正在搜索其他源…</div>';
  var others = SRC.filter(function(s) { return s.id !== G.src; });
  var settled = 0, found = null;
  others.forEach(function(s) {
    fetchJSON(s.url(item.title)).then(function(json) {
      var items = parseCMS(json);
      var playable = items.filter(function(it) { return it.pu; });
      if (playable.length && (!found || playable.length > found.playable)) {
        found = { src: s, items: playable, playable: playable.length };
      }
      settled++;
      if (settled === others.length) resolveSwitch();
    }).catch(function() {
      settled++;
      if (settled === others.length) resolveSwitch();
    });
  });
  function resolveSwitch() {
    item._switching = false;
    if (found) {
      item._switched = true;
      item.pf = found.items[0].pf;
      item.pu = found.items[0].pu;
      G.src = found.src.id;
      CI = found.items;
      PS = parsePlay(item.pf, item.pu);
      renderEpFromPS(item);
    } else {
      item._switched = true;
      placeholderEl.innerHTML = '<div style="font-size:11px;color:var(--t3);padding:10px 0">未找到其他播放源</div>';
    }
  }
}
function renderEpFromPS(item) {
  var body = document.getElementById('modalBody');
  var epWrap = body.querySelector('.mepwrap');
  if (!epWrap) {
    epWrap = document.createElement('div');
    epWrap.className = 'mepwrap';
    body.querySelector('.mbd') && body.querySelector('.mbd').appendChild(epWrap);
  }
  var epHTML = '';
  if (PS.length) {
    for (var si = 0; si < PS.length; si++) {
      epHTML += '<div class="msc">▸ ' + esc(PS[si].name) + ' (' + PS[si].episodes.length + '集)</div><div class="meg">';
      for (var ei = 0; ei < PS[si].episodes.length; ei++) {
        epHTML += '<button type="button" class="eb" onclick="playEp(' + si + ',' + ei + ')">' + esc(PS[si].episodes[ei].name) + '</button>';
      }
      epHTML += '</div>';
    }
  }
  epWrap.innerHTML = epHTML;
}

/* ===== CMS 详情 ===== */
function openCMS(idx) {
  if (!CI[idx]) return;
  var item = CI[idx];
  PI = item;
  PS = parsePlay(item.pf, item.pu);
  var pp = cmImg(item.img);
  var tagArr = [item.type, item.year, item.area, item.lang].filter(Boolean);
  var tags = '';
  for (var t = 0; t < tagArr.length; t++) tags += '<span class="mti">' + esc(tagArr[t]) + '</span>';
  var desc = (item.desc || '').replace(/<[^>]*>/g, '').trim();
  // 简介截断：过长的资源站简介只保留前 160 字，避免撑爆弹窗
  if (desc.length > 160) desc = desc.slice(0, 160).trim() + '…';
  // 演职员块：导演 + 主演（资源站条目自带，缺失则不显示对应行；可点击查演员推荐）
  var castHTML = '';

    castHTML += '<div class="mcast">';
    if (item.director) {
      var dirBtn = '<button type="button" class="mc-act" onclick="searchActor(\'' + attrEsc(item.director.trim()) + '\',\'导演\')">' + esc(item.director.trim()) + '</button>';
      castHTML += '<div class="mc-row"><span class="mc-label">导演</span><span class="mc-val">' + dirBtn + '</span></div>';
    }
    if (shown.length) {
      var chips = '';
      for (var a = 0; a < shown.length; a++) {
        chips += '<button type="button" class="mc-act" onclick="searchActor(\'' + attrEsc(shown[a]) + '\',\'主演\')">' + esc(shown[a]) + '</button>';
      }
      var tail = rest > 0 ? '<span class="mc-rest">' + rest + ' 等</span>' : '';
      castHTML += '<div class="mc-row"><span class="mc-label">主演</span><span class="mc-val">' + chips + tail + '</span></div>';

  }

      for (var ei = 0; ei < PS[si].episodes.length; ei++) {
        epHTML += '<button type="button" class="eb" onclick="playEp(' + si + ',' + ei + ')">' + esc(PS[si].episodes[ei].name) + '</button>';
      }
      epHTML += '</div>';
    }
  } else {
    epHTML = '<div class="mepwrap"><button type="button" class="abtn" id="swSrcBtn" style="margin:0">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v6h6"/><path d="M20 20v-6h-6"/><path d="M4 10a8 8 0 0114-4M20 14a8 8 0 01-14 4"/></svg>换源播放</button></div>' +
      '<div id="swSrcLoading" style="font-size:12px;color:var(--acc);padding:8px 0;display:none">正在搜索其他源…</div>';
    // 自动触发换源
    setTimeout(function() {
      var btn = document.getElementById('swSrcBtn');
      if (btn) btn.addEventListener('click', function() {
        switchSourceFor(item, document.getElementById('swSrcLoading'));
      });
      // 自动触发一次（不重复）
      if (!item._switched) switchSourceFor(item, document.getElementById('swSrcLoading'));
    }, 0);
  }
  var html = '';
  html += '<div class="mbg">' + cmImg(item.img) + '</div>';
  html += '<div class="mbd"><div class="mtp"><div class="mp">' + pp + '</div><div class="mi">';
  html += '<div class="mt2">' + esc(item.title) + '</div>';
  if (tags) html += '<div class="mtg">' + tags + '</div>';
  if (item.note) html += '<div class="mdt"><strong>状态:</strong> ' + esc(item.note) + '</div>';
  if (item.director) html += '<div class="mdt"><strong>导演:</strong> ' + esc(item.director) + '</div>';
  if (item.actor) html += '<div class="mdt"><strong>主演:</strong> ' + esc(item.actor) + '</div>';
  html += '</div></div>';
  if (desc) html += '<div class="mdesc">' + esc(desc) + '</div>';
  html += castHTML;
  html += '<div id="cmStills" class="mstills"></div>';
  html += epHTML + '</div>';
  document.getElementById('modalBody').innerHTML = html;
  document.querySelectorAll('#modalBody [data-orig]').forEach(function(img) { tryLoadImg(img); });
  openModal();
  initCmStills(item.title, item.year);
}

/* ===== 夸克详情 ===== */
function openQK(idx) {

  html += '<div class="mdt"><strong>排名:</strong> #' + d.rank + ' <strong>热度:</strong> ' + fmtN(d.hot) + '</div>';
  html += '</div></div>';

  if (d.director) initDir = d.director.split(/[,，、&|\/\s]+/).map(function(s){return s.trim();}).filter(Boolean).filter(function(n){return n && n!==d.title;});
  if (d.actor) initCast = d.actor.split(/[,，、&|\/\s]+/).map(function(s){return s.trim();}).filter(Boolean).filter(function(n){return n && n!==d.title;});
  if (initDir.length || initCast.length) {

      castNow += '<div class="mc-row"><span class="mc-label">导演</span><span class="mc-val">' + dB + (initDir.length>4?' <span class="mc-rest">'+(initDir.length-4)+' 等</span>':'') + '</span></div>';

      var cB = cShow.map(function(n){ return '<button type="button" class="mc-act" onclick="searchActor(\'' + attrEsc(n) + '\',\'主演\')">' + esc(n) + '</button>'; }).join('');
      castNow += '<div class="mc-row"><span class="mc-label">主演</span><span class="mc-val">' + cB + (cRest>0?' <span class="mc-rest">'+cRest+' 等</span>':'') + '</span></div>';
    }
    castNow += '</div>';
  }
  html += '<div id="dbDetailSlot" style="margin-top:8px">' + (initDir.length||initCast.length ? '<div class="mc-load">正在补充简介…</div>' + castNow : '<div class="mc-load">正在补充简介与演职员…</div>') + '</div>';

/* 用片名并行查 4 个资源站 detail，取第一条带简介/演职员的回填到豆瓣详情弹窗（不依赖 TMDB） */
function fillDbDetailByCms(d) {
  var slot = document.getElementById('dbDetailSlot');
  if (!slot) return;
  var name = (d.title || '').trim();
  var filled = false;
  function render(meta) {
    if (filled) return;
    filled = true;
    var slot = document.getElementById('dbDetailSlot');
    if (!slot) return;
    // 保留 openDB 已渲染的演职员按钮块 .mcast，绝不整体销毁它
    var mcast = slot.querySelector('.mcast');

    // 1) 先把「正在补充简介…」占位从 DOM 里摘掉
    var loadingEl = slot.querySelector('.mc-load');
    if (loadingEl) loadingEl.remove();

    // 2) 简介（只追加简介节点，不动 mcast）
    var descEl = null;
    var descText = '';
    if (meta && meta.desc) {
      descText = String(meta.desc).trim();
      if (descText.length > 200) descText = descText.slice(0, 200).trim() + '…';
      if (descText) {
        descEl = document.createElement('div');
        descEl.className = 'mdesc';
        descEl.textContent = descText;
        if (mcast) slot.insertBefore(descEl, mcast); else slot.appendChild(descEl);
      }
    }

    // 3) 若没有 mcast 且资源站查到更全的导演/主演，动态构建按钮块
    if (!mcast && meta) {
      var dir = (meta.director || '').split(/[,，、&|\/\s]+/).map(function(s){return s.trim();}).filter(Boolean);
      var cast = (meta.actor || '').split(/[,，、&|\/\s]+/).map(function(s){return s.trim();}).filter(Boolean);
      dir = dir.filter(function(n){ return n && n !== name; });
      cast = cast.filter(function(n){ return n && n !== name; });
      if (dir.length || cast.length) {
        var block = document.createElement('div');
        block.className = 'mcast';
        var rows = '';
        if (dir.length) {
          var dB = dir.slice(0,4).map(function(n){ return '<button type="button" class="mc-act" onclick="searchActor(\'' + attrEsc(n) + '\',\'导演\')">' + esc(n) + '</button>'; }).join('');
          rows += '<div class="mc-row"><span class="mc-label">导演</span><span class="mc-val">' + dB + (dir.length>4?' <span class="mc-rest">'+(dir.length-4)+' 等</span>':'') + '</span></div>';
        }
        if (cast.length) {
          var cShow = cast.slice(0,8), cRest = cast.length - cShow.length;
          var cB = cShow.map(function(n){ return '<button type="button" class="mc-act" onclick="searchActor(\'' + attrEsc(n) + '\',\'主演\')">' + esc(n) + '</button>'; }).join('');
          rows += '<div class="mc-row"><span class="mc-label">主演</span><span class="mc-val">' + cB + (cRest>0?' <span class="mc-rest">'+cRest+' 等</span>':'') + '</span></div>';
        }
        block.innerHTML = rows;
        slot.insertBefore(block, descEl || null);
      }
    }

    // 4) 若什么都没有，给个「暂无」占位（mcast 仍保留）
    if (!slot.querySelector('.mcast') && !descEl) {
      var empty = document.createElement('div');
      empty.className = 'mc-empty';
      empty.innerHTML = '暂无简介' +
        (d.url ? '，<button type="button" class="mc-douban" onclick="window.open(\'' + esc(d.url).replace(/\'/g, "\\'") + '\',\'_blank\')">去豆瓣看 →</button>' : '');
      slot.appendChild(empty);
    }
  }
  if (!name) { render(null); return; }
  var settled = 0, total = SRC.length;
  SRC.forEach(function(s){
    var to = setTimeout(function(){ /* 单源超时忽略 */ }, 9000);
    fetchJSON(s.url(name)).then(function(json){
      clearTimeout(to);
      var items = parseCMS(json);
      var pick = null;
      for (var i=0;i<items.length;i++){ if(items[i].desc||items[i].actor||items[i].director){ pick=items[i]; break; } }
      if (pick && (pick.desc||pick.actor||pick.director)) render(pick);
      settled++;
      if (settled >= total) render(null);
    }).catch(function(){ clearTimeout(to); settled++; if (settled >= total) render(null); });
  });
}

function searchFrom(title) {

/* ===== 播放器 ===== */
function playEp(si, ei) {
  if (!PI || !PS.length || !PS[si] || !PS[si].episodes[ei]) return;
  closeModal();
  _plSrc = si;
  _plEp = ei;
  document.getElementById('playerTitle').textContent = PI.title;
  var sel = document.getElementById('playerSel');
  sel.innerHTML = '';
  for (var i = 0; i < PS.length; i++) {
    var o = document.createElement('option');
    o.value = i;
    o.textContent = PS[i].name + ' (' + PS[i].episodes.length + '集)';
    if (i === si) o.selected = true;
    sel.appendChild(o);
  }
  sel.onchange = function() { _plSrc = +this.value; _plEp = 0; renderEpSide(); doPlay(); };
  document.getElementById('player').classList.add('open');
  try { if (location.hash !== '#__player') history.pushState({cm:1}, '', '#__player'); } catch(e) {}
  document.body.style.overflow = 'hidden';
  renderEpSide();
  _cmSyncLayer();
  doPlay();
}

function renderEpSide() {
  var src = PS[_plSrc];
  if (!src) return;
  document.getElementById('epSideInfo').textContent = src.name + ' · 共' + src.episodes.length + '集';
  var el = document.getElementById('epList');
  var h = '<div class="peg">';
  for (var i = 0; i < src.episodes.length; i++) {
    h += '<div class="pei' + (i === _plEp ? ' active' : '') + '" onclick="clickEp(' + i + ')">' + esc(src.episodes[i].name) + '</div>';
  }
  h += '</div>';
  el.innerHTML = h;
  var act = el.querySelector('.active');
  if (act) act.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  document.getElementById('playerInfo').textContent = src.name + ' · ' + (src.episodes[_plEp] ? src.episodes[_plEp].name : '');
}

function clickEp(i) {
  _plEp = i;
  renderEpSide();
  doPlay();
}

function doPlay() {
  var src = PS[_plSrc];
  var ep = src ? src.episodes[_plEp] : null;
  if (!ep) return;
  var area = document.getElementById('playerArea');
  area.innerHTML = '<div class="pmsg"><div class="ring"></div><div>正在加载...</div></div>';
  if (HlsRef && HlsRef._inst) { try { HlsRef._inst.destroy(); } catch(e){} HlsRef._inst = null; }
  var url = ep.url;
  // m3u8：统一走本地 /hls 端点（把 master/variant/ts 全重写为同源带 CORS 的 URL）
  if (/\.m3u8/i.test(url)) {
    url = LOCAL_HLS + encodeURIComponent(ep.url);
  }
  if (/\.m3u8/i.test(url) && HlsRef && HlsRef.isSupported()) {
    var v = document.createElement('video');
    v.controls = false; v.autoplay = true; v.playsInline = true;
    // 原生控制栏不用了：ROM WebView 的原生全屏键不可靠（点击不触发 onShowCustomView），
    // 改自绘控制条 attachCmControls 接管中央播放/暂停 + 底部进度条 + 全屏键直连 cmEnterFull。
    v.style.cssText = 'width:100%;height:100%;object-fit:contain;background:#0b0b0e';
    area.innerHTML = '';
    area.appendChild(v);
    cmShowLoading();
    attachCmControls(v);
    var h = new HlsRef({
      maxBufferLength: 30,
      xhrSetup: function(xhr, config) {
        // 上游 m3u8/ts 需要 Referer 绕过部分防盗链
        try { xhr.setRequestHeader('Referer', 'https://movie.douban.com/'); } catch (e) {}
      }
    });
    HlsRef._inst = h;
    h.loadSource(url);
    h.attachMedia(v);
    h.on(HlsRef.Events.MANIFEST_PARSED, function() { v.play().catch(function(){}); });
    // 看门狗：12s 还没开始播放就提示加载失败（代理挂了 / 源失效）
    var _wd=setTimeout(function(){
      if(v.currentTime===0 && v.readyState<3){
        var _tip = '<div class="pmsg">' + icoSVG(ICO.play) + '<div style="text-align:center"><div style="color:var(--red);font-size:13px;margin-bottom:8px">视频加载超时</div><div style="font-size:11px;color:var(--t3)">当前播放源可能失效，试试上方下拉换一个播放源</div></div></div>';
        area.innerHTML = _tip;
        if(HlsRef&&HlsRef._inst){try{HlsRef._inst.destroy();}catch(e){}HlsRef._inst=null;}
      }
    },12000);
    v.addEventListener("playing",function(){clearTimeout(_wd);cmHideLoading();});
    h.on(HlsRef.Events.ERROR, function(_, data) {
      if (data.fatal) {
        if (data.type === HlsRef.ErrorTypes.NETWORK_ERROR) h.startLoad();
        else if (data.type === HlsRef.ErrorTypes.MEDIA_ERROR) h.recoverMediaError();
        else useIframe(ep.url);
      }
    });
  } else if (/\.mp4/i.test(ep.url)) {
    var v2 = document.createElement('video');
    v2.src = url; v2.controls = false; v2.autoplay = true; v2.playsInline = true;
    // 同上，原生控制栏不可靠 → 自绘控制条
    v2.style.cssText = 'width:100%;height:100%;object-fit:contain;background:#0b0b0e';
    area.innerHTML = '';
    area.appendChild(v2);
    cmShowLoading();
    attachCmControls(v2);
    v2.addEventListener('playing', function(){ cmHideLoading(); });
    v2.play().catch(function(){});
  } else {
    useIframe(url);
  }
}

function useIframe(url) {
  var a = document.getElementById('playerArea');
  a.innerHTML = '';
  var f = document.createElement('iframe');
  f.src = url; f.allowFullscreen = true;
  f.setAttribute('allow', 'autoplay;encrypted-media;fullscreen');
  f.style.cssText = 'width:100%;height:100%;border:none;background:#0b0b0e';
  f.onload = function() { cmHideLoading(); };
  a.appendChild(f);
  cmShowLoading();
}
// 播放加载覆盖层：视频/iframe 未就绪时显示转圈，避免一片死黑让人以为是坏了
function cmShowLoading() {
  var a = document.getElementById('playerArea'); if (!a) return;
  if (document.getElementById('cmLoad')) return;
  var d = document.createElement('div'); d.id = 'cmLoad'; d.className = 'pvload';
  d.innerHTML = '<div class="spin"></div>';
  a.appendChild(d);
}
function cmHideLoading() {
  var el = document.getElementById('cmLoad'); if (el) el.parentNode && el.parentNode.removeChild(el);
}

/* ===== 自绘播放控制条（controls=false 接管，跨机型一致） ===== */
function fmtCmTime(s) {
  if (!isFinite(s) || s < 0) return '--:--';
  s = Math.floor(s); var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  var mm = (m < 10 ? '0' : '') + m, ss = (x < 10 ? '0' : '') + x;
  return h > 0 ? h + ':' + mm + ':' + ss : mm + ':' + ss;
}
function attachCmControls(v) {
  var area = document.getElementById('playerArea');
  if (!area || !v) return;
  if (area.__cmc) { try { area.__cmc.destroy(); } catch (e) {} area.__cmc = null; }
  area.style.position = 'relative';
  var wrap = document.createElement('div');
  wrap.className = 'cmcwrap';
  wrap.innerHTML =
    '<div class="cmcenter"></div>' +
    '<div class="cmc"><span class="cmt">00:00</span>' +
    '<input type="range" class="cms" min="0" max="1000" value="0" step="1">' +
    '<span class="cmt" data-d>--:--</span>' +
    /* 控制条内置 截图/录GIF（全屏时与进度条同显隐；iframe 源无控制条，仍走头部按钮） */
    '<button type="button" class="cmtool" data-cm="snap" title="截图（当前画面保存 PNG）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 012-2h1.5l1-1.5h9l1 1.5H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><circle cx="12" cy="12.5" r="3.2"/></svg></button>' +
    '<button type="button" class="cmtool" data-cm="gif" title="录制 5 秒 GIF 动图"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10l5-3v10l-5-3"/></svg></button>' +
    '<button type="button" class="cmf" title="全屏">\u26F6</button></div>';
  area.appendChild(wrap);
  var center = wrap.querySelector('.cmcenter');
  var rng = wrap.querySelector('.cms');
  var tCur = wrap.querySelectorAll('.cmt')[0];
  var tDur = wrap.querySelector('[data-d]');
  var dragging = false;
  var ICO_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="3.6" height="14" rx="1"/><rect x="13.4" y="5" width="3.6" height="14" rx="1"/></svg>';
  var ICO_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>';
  function setCenter(playing) { center.innerHTML = playing ? ICO_PAUSE : ICO_PLAY; }
  function show() { try { if (window.__cmPh) window.__cmPh.showReset(); } catch (e) {} }
  function togglePlay() { try { if (v.paused) v.play(); else v.pause(); } catch (e) {} }
  center.addEventListener('click', function(e) { e.stopPropagation(); togglePlay(); });
  wrap.querySelector('.cmc').addEventListener('click', function(e) { e.stopPropagation(); show(); });
  wrap.addEventListener('click', function() { show(); });
  rng.addEventListener('input', function() {
    dragging = true;
    var d = v.duration;
    if (isFinite(d) && d > 0) tCur.textContent = fmtCmTime(rng.value / 1000 * d);
  });
  rng.addEventListener('change', function() {
    var d = v.duration;
    if (isFinite(d) && d > 0) { try { v.currentTime = rng.value / 1000 * d; } catch (e) {} }
    dragging = false; show();
  });
  wrap.querySelector('.cmf').addEventListener('click', function(e) {
    e.stopPropagation();
    var p = document.getElementById('player');
    if (p && p.classList.contains('full')) cmExitFull(); else cmEnterFull();
  });
  /* 控制条内置 截图/录GIF：点击后保持控制条可见，避免点完立刻淡出 */
  var cmSnapFs = wrap.querySelector('.cmtool[data-cm="snap"]');
  var cmGifFs = wrap.querySelector('.cmtool[data-cm="gif"]');
  if (cmSnapFs) cmSnapFs.addEventListener('click', function(e) { e.stopPropagation(); show(); snapShot(); });
  if (cmGifFs) cmGifFs.addEventListener('click', function(e) { e.stopPropagation(); show(); recGif(); });
  v.addEventListener('play', function() { setCenter(true); });
  v.addEventListener('pause', function() { setCenter(false); show(); });
  v.addEventListener('ended', function() { setCenter(false); show(); });
  v.addEventListener('timeupdate', function() {
    var d = v.duration;
    if (isFinite(d) && d > 0) {
      if (!dragging) {
        rng.value = Math.round(v.currentTime / d * 1000);
        tCur.textContent = fmtCmTime(v.currentTime);
      }
      tDur.textContent = fmtCmTime(d);
    }
  });
  setCenter(!v.paused);
  show();
  area.__cmc = {
    wrap: wrap,
    destroy: function() { try { wrap.parentNode.removeChild(wrap); } catch (e) {} }
  };
  // 控制条交给全屏显隐管理器（与头部一起：3 秒自动隐藏/点屏幕唤出）
  try { if (window.__cmPh && window.__cmPh.setWrap) window.__cmPh.setWrap(wrap); } catch (e) {}
}

function renderCmStills(box, list, token) {

function initCmStills(title, year) {
  var box = document.getElementById('cmStills');
  if (!box || !title) return;
  var t = cmCleanTitle(title);
  if (!t) return;
  var y = String(year || '').slice(0, 4);
  var token = t + '|' + y;
  box.__tok = token;
  box.innerHTML = '<div class="mst-hd">剧照 · 海报</div><div class="mstrip"><div class="mc-load">正在获取剧照…</div></div>';
  try {
    var c = JSON.parse(localStorage.getItem(cmStillsCacheKey(t, y)) || 'null');
    if (c && c.list && c.list.length && Date.now() - c.t < 7 * 864e5) { renderCmStills(box, c.list, token); return; }
  } catch (e) {}
  function search(q) {
    return fetchJSON('https://api.themoviedb.org/3/search/multi?api_key=' + CM_TMDB_KEY + '&language=zh-CN&query=' + encodeURIComponent(q))
      .then(function(res) {
        var rs = (res && res.results) || [];
        if (!rs.length) throw new Error('no result: ' + q);
        var pick = rs[0];
        if (y) {
          for (var i = 0; i < rs.length; i++) {
            var d = rs[i].release_date || rs[i].first_air_date || '';
            if (d.indexOf(y) === 0) { pick = rs[i]; break; }
          }
        }
        var mt = pick.media_type || (pick.first_air_date ? 'tv' : 'movie');
        return fetchJSON('https://api.themoviedb.org/3/' + mt + '/' + pick.id + '/images?api_key=' + CM_TMDB_KEY);
      });
  }
  search(t)
    .catch(function() { return t !== title ? search(title) : Promise.reject(new Error('no match')); })
    .then(function(im) {
      var posters = (im && im.posters) || [];
      var bds = (im && im.backdrops) || [];
      function firstByLang(a) {
        for (var i = 0; i < a.length; i++) if (a[i].iso_639_1 === 'zh') return a[i];
        for (var j = 0; j < a.length; j++) if (!a[j].iso_639_1) return a[j];
        return a[0] || null;
      }
      var list = [];
      var pz = firstByLang(posters);
      if (pz) list.push({ k: 'p', p: pz.file_path });
      var sb = bds.slice().sort(function(a, b) {
        var za = a.iso_639_1 === 'zh' ? 1 : 0, zb = b.iso_639_1 === 'zh' ? 1 : 0;
        return (zb - za) || ((b.vote_average || 0) - (a.vote_average || 0));
      });
      for (var i = 0; i < sb.length && list.length < 11; i++) list.push({ k: 'b', p: sb[i].file_path });
      if (!list.length) throw new Error('no images');
      try { localStorage.setItem(cmStillsCacheKey(t, y), JSON.stringify({ t: Date.now(), list: list })); } catch (e) {}
      renderCmStills(box, list, token);
      // 顺手取 TMDB 详情里的 vote_average（用于分享卡评分展示）
      // 用同一个 pick（search 里找到的那一条）查 detail，避免额外网络开销
      var mt2 = pick.media_type || (pick.first_air_date ? 'tv' : 'movie');
      return fetchJSON('https://api.themoviedb.org/3/' + mt2 + '/' + pick.id + '?api_key=' + CM_TMDB_KEY + '&language=zh-CN');
    })
    .then(function(detail) {
      if (detail && detail.vote_average) {
        PI.tmdbRate = parseFloat(detail.vote_average) || 0;
      }
    })
    .catch(function(e) {
      console.log('[CM] stills or rating fail:', e && e.message);
      if (box.__tok === token && box.parentNode) box.parentNode.removeChild(box);
    });
}

var 
GIF_SCRIPT = 'gif.js';
var GIF_WORKER = 'gif.worker.js';
var gifBusy = false;
function ensureGifLib(cb) {
  if (window.GIF) return cb();
  if (window.__gifLoading) return cb();
  window.__gifLoading = true;
  var s = document.createElement('script');
  s.src = GIF_SCRIPT;
  s.onload = function() { window.__gifLoading = false; cb(); };
  s.onerror = function() { window.__gifLoading = false; gifStat('GIF 库加载失败'); };
  document.head.appendChild(s);
}

function recGif() {
  if (gifBusy) return;
  var v = curPlayerVideo();
  if (!v) { gifStat('只能录制视频源，非网页源'); return; }
  var BTN = document.getElementById('btnGif');
  var BTNFS = document.querySelector('#playerArea .cmtool[data-cm="gif"]'); /* 控制条内置的 GIF 按钮（全屏用） */
  ensureGifLib(function() {
    if (!window.GIF) { gifStat('GIF 库不可用'); return; }
    gifBusy = true;
    BTN.classList.add('rec');
    if (BTNFS) BTNFS.classList.add('rec');
    var targetW = 480;
    var vw = v.videoWidth || 1280, vh = v.videoHeight || 720;
    var W = targetW, H = Math.round(targetW * vh / vw) || 270;
    /* 兜底：播放路径 area.innerHTML='' 会把 #gifCanvas 一并清掉（曾导致 cv.width 抛
       TypeError、录 GIF 点了没反应），不存在时重建一个挂在 playerArea 上 */
    var cv = document.getElementById('gifCanvas');
    if (!cv) {
      cv = document.createElement('canvas');
      cv.id = 'gifCanvas';
      cv.style.display = 'none';
      var cvHost = document.getElementById('playerArea') || document.body;
      cvHost.appendChild(cv);
    }
    cv.width = W; cv.height = H;
    var ctx = cv.getContext('2d');
        // 录 GIF：优先「直接内联 worker 源码」到 Blob（离线/CDN 被墙都可用）；内联源码不可用时退回本地文件路径。
    var workerUrl = null;
    try {
      if (window.__gifWorkerSrc && window.__gifWorkerSrc.length > 200) {
        workerUrl = URL.createObjectURL(new Blob([window.__gifWorkerSrc], { type: 'application/javascript' }));
      }
    } catch (e) {}
    if (!workerUrl && GIF_WORKER) { workerUrl = GIF_WORKER; }
    var gifOpts = { workers: 2, quality: 10, width: W, height: H, backgroundColor: '#000000' };
    if (workerUrl) gifOpts.workerScript = workerUrl;
    var gif = new window.GIF(gifOpts);
    var FRAME_MS = 100, TOTAL_MS = 5000, count = 0;
    var timer = setInterval(function() {
      try { ctx.drawImage(v, 0, 0, W, H); } catch (e) {}
      gif.addFrame(cv, { copy: true, delay: FRAME_MS });
      count++;
      var remain = Math.max(0, Math.ceil((TOTAL_MS - count * FRAME_MS) / 1000));
      gifStat('录制中 ' + remain + 's');
      if (count * FRAME_MS >= TOTAL_MS) {
        clearInterval(timer);
        /* gif.js 0.2.0 标准 API 是 render() + on('finished')；旧代码调的 gif.finish() 根本
           不存在 → 必抛 TypeError：录完无输出、gifBusy 卡死 true、GIF 按钮此后永远没反应 */
        gif.on('finished', function(blob) {
          var out = blob || null;
          if (!out && typeof gif.getBlob === 'function') { try { out = gif.getBlob(); } catch (e2) {} }
          if (out) downloadBlob(out, mediaFileName('GIF') + '.gif');
          gifStat(out ? ('已保存 ' + count + ' 帧 GIF') : 'GIF 生成失败');
          gifBusy = false;
          BTN.classList.remove('rec');
          if (BTNFS) BTNFS.classList.remove('rec');
        });
        try { gif.render(); } catch (e) {
          gifStat('GIF 编码失败');
          gifBusy = false;
          BTN.classList.remove('rec');
          if (BTNFS) BTNFS.classList.remove('rec');
        }
      }
    }, FRAME_MS);
  });
}
